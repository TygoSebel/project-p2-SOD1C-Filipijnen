    <div class="container">
<h1>Aanbieden om mee te werken</h1>
<p>
Wil je meewerken aan ons project? Vul dan het formulier hieronder in.
We nemen zo snel mogelijk contact met je op.
</p>


<form action="#" method="post">
<div class="form-group">
<label for="naam">Naam</label>
<input type="text" id="naam" name="naam" required>
</div>


<div class="form-group">
<label for="email">E-mailadres</label>
<input type="email" id="email" name="email" required>
</div>


<div class="form-group">
<label for="telefoon">Telefoonnummer</label>
<input type="tel" id="telefoon" name="telefoon">
</div>


<div class="form-group">
<label for="rol">Waar wil je bij helpen?</label>
<select id="rol" name="rol" required>
<option value="">-- Kies een optie --</option>
<option value="organisatie">Organisatie</option>
<option value="communicatie">Communicatie</option>
<option value="techniek">Techniek</option>
<option value="vrijwilliger">Vrijwilligerswerk</option>
</select>
</div>


<div class="form-group">
<label for="bericht">Motivatie / Bericht</label>
<textarea id="bericht" name="bericht" rows="5" placeholder="Vertel kort waarom je wilt meewerken"></textarea>
</div>


<div class="form-group checkbox">
<label>
<input type="checkbox" required>
Ik ga akkoord met het gebruik van mijn gegevens
</label>
</div>


<button type="submit">Versturen</button>
</form>
</div>
